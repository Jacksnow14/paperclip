# AUR-5095: make paperclip.service's start-limit window actually bite, and
# pair the bound with a failover so it cannot become a permanent silent outage.
# Installed to ~/.config/systemd/user/paperclip.service.d/ by
# install-crash-loop-failover.sh.
#
# Stock unit: RestartSec=10 with the DEFAULT StartLimitIntervalSec=10s.
# Restarts are spaced at least as far apart as the rate-limit window, so the
# window can never accumulate StartLimitBurst=5 starts: the limiter was
# structurally INERT. Measured 2026-08-05 16:31-16:37Z: 15 restarts in 6
# minutes (migration 0098 crash-loop), nothing tripped, control plane down
# fleet-wide (AUR-4999).
#
# 600s holds 5 attempts even when each failing attempt burns ~2 minutes
# (5 starts need 4 cycles: 4 x (RestartSec 10s + attempt time) <= 600s).
# StartLimitAction stays at the default none: on the 5th failed start the unit
# enters the failed state and OnFailure= runs the failover — flip `current`
# back to the last-good release, quarantine the failed one, notify. Without
# that pairing this drop-in alone would CONVERT an unbounded crash-loop into a
# permanent dead unit; never install it without paperclip-failover.service.
#
# Known tradeoff, accepted: the burst counter counts ALL unit starts in the
# window, so 5+ rapid manual restarts inside 10 minutes also trip it. The
# failover only acts when the unit is genuinely in the failed state, recovery
# is a rollback to a healthy release plus an INFO notice, and undoing a false
# quarantine is one ledger line + one marker file.
[Unit]
StartLimitIntervalSec=600
StartLimitBurst=5
OnFailure=paperclip-failover.service
