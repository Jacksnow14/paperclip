# AUR-4187: the checkout-drift axis (AUR-4227) ships DELIBERATELY EMPTY and is
# opt-in via PAPERCLIP_DRIFT_CHECKOUTS. Shipped empty it watched nothing: no
# /var/log/paperclip-deploy-drift.log.checkout-* file existed between the
# AUR-4227 merge and 2026-08-05, so the axis had produced zero observations.
#
# This arms it with the checkouts that agents, routines and services provably
# execute from. Derived from heartbeat_runs.workspace_cwd (the resolved-cwd
# record AUR-4645 added) over a 14-day window, unioned with a host-wide sweep
# for checkouts of the deliverability package -- never from workspace_source,
# which cannot distinguish a real tree from an agent-home fallback.
#
# Only trees INTENDED to track an upstream branch are listed. Feature-branch
# worktrees under ~/auranode-worktrees and review scratch under /tmp are
# deliberately excluded: they are supposed to lag, and watching them would
# page forever for a non-defect.
#
# Format: label:path:intended-branch, newline-separated. Labels are used as
# log/state filename suffixes, so keep them filename-safe.
#
# AUR-5633: auranode-default (the CTO agent's own long-lived operational
# workspace, this project's own checkout of Jacksnow14/Auranode@main) was
# removed from the list. It tracks the exact same repo+branch as
# auranode-main and auranode-deliverability, both of which are already
# watched here and are kept clean/current. A third watcher of the same
# repo+branch adds zero incremental code-currency coverage; unlike the other
# two, this checkout is also a live, months-deep operational archive
# (deliverables/, research notes, in-flight scratch across dozens of
# issues) that will essentially never be clean, so watching it only pages
# forever for a non-defect. See AUR-5633 for the full investigation.
Environment="PAPERCLIP_DRIFT_CHECKOUTS=auranode-main:/home/ievgen/Auranode:main\nauranode-deliverability:/home/ievgen/Auranode-deliverability:main\npaperclip-shared:/home/ievgen/paperclip:master\nbooking-runtime:/home/ievgen/booking-service-runtime-main:main\ntelephony-runtime:/home/ievgen/telephony-gateway-runtime-main:main\ninterop-bridge-runtime:/home/ievgen/interop-bridge-runtime:main"
Environment="PAPERCLIP_DRIFT_CHECKOUT_ISSUE_URL=https://paperclip/AUR/issues/AUR-4187"
