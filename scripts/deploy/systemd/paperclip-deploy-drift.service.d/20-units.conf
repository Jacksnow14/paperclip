# AUR-5648 (follow-up to AUR-5647): no deploy path ever re-runs the systemd
# installer scripts in scripts/deploy/, so a unit/timer/drop-in edit merges to
# master, ships in the release tarball, and then sits inert on disk until a
# human happens to run the relevant install-*.sh by hand. AUR-5633 merged and
# shipped in release 3a8d0d597825, but the installed drop-in
# (10-checkouts.conf, itself watched below) stayed the Aug-5 copy for 183h,
# paging on an already-obsolete premise.
#
# This arms the unit-drift axis with every systemd artifact a repo install-*.sh
# script places on disk, derived 2026-08-13 by grepping every
# scripts/deploy/install-*.sh for `cp ... /etc/systemd/system` / `UNIT_DIR`
# (system-level) and the user-level equivalents under
# ~/.config/systemd/user. 15 tracked artifacts across 7 real installer
# scripts. paperclip-mem-watch.* is deliberately NOT listed: the runbook
# referencing install-mem-watch-sampler.sh's target script has no
# source-of-truth copy anywhere in this repo to diff against (see AUR-5648
# discussion) — flagged as a separate, smaller follow-up rather than invented
# here.
#
# Format: label:source-relative-path:installed-path:level, newline-separated.
# source-relative-path is relative to scripts/deploy/systemd/ in the ACTIVE
# release (compared against $APP_ROOT/current, never origin/master — a
# release that has not yet activated a unit edit is not drift). level is
# system or user, informational only. Labels are used as log/state filename
# suffixes, so keep them filename-safe.
[Service]
Environment="PAPERCLIP_DRIFT_UNITS=deploy-drift-service:paperclip-deploy-drift.service:/etc/systemd/system/paperclip-deploy-drift.service:system\ndeploy-drift-timer:paperclip-deploy-drift.timer:/etc/systemd/system/paperclip-deploy-drift.timer:system\npr-review-service:paperclip-pr-review.service:/etc/systemd/system/paperclip-pr-review.service:system\npr-review-timer:paperclip-pr-review.timer:/etc/systemd/system/paperclip-pr-review.timer:system\nrelease-prune-service:paperclip-release-prune.service:/etc/systemd/system/paperclip-release-prune.service:system\nrelease-prune-timer:paperclip-release-prune.timer:/etc/systemd/system/paperclip-release-prune.timer:system\nmem-watch-alert-service:paperclip-mem-watch-alert.service:/etc/systemd/system/paperclip-mem-watch-alert.service:system\nmem-watch-alert-timer:paperclip-mem-watch-alert.timer:/etc/systemd/system/paperclip-mem-watch-alert.timer:system\nfleet-refresh-service:paperclip-fleet-refresh.service:/etc/systemd/system/paperclip-fleet-refresh.service:system\nfleet-refresh-timer:paperclip-fleet-refresh.timer:/etc/systemd/system/paperclip-fleet-refresh.timer:system\ndrift-checkouts-dropin:paperclip-deploy-drift.service.d/10-checkouts.conf:/etc/systemd/system/paperclip-deploy-drift.service.d/10-checkouts.conf:system\nauto-deploy-service:paperclip-auto-deploy.service:/home/ievgen/.config/systemd/user/paperclip-auto-deploy.service:user\nauto-deploy-timer:paperclip-auto-deploy.timer:/home/ievgen/.config/systemd/user/paperclip-auto-deploy.timer:user\nfailover-service:paperclip-failover.service:/home/ievgen/.config/systemd/user/paperclip-failover.service:user\ncrashloop-dropin:paperclip-crashloop-bound.conf:/home/ievgen/.config/systemd/user/paperclip.service.d/paperclip-crashloop-bound.conf:user"
Environment="PAPERCLIP_DRIFT_UNIT_ISSUE_URL=https://paperclip/AUR/issues/AUR-5648"
