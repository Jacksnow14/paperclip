# AUR-5885 (follow-up to AUR-5866): unit-drift (20-units.conf) only compares
# the unit FILE on disk against the active release — it answers "is the
# right unit installed," not "is it actually alive." paperclip-pr-review.timer
# showed status=ok on that axis for the full 13 days it sat disabled and its
# service failed, because the file itself never changed. This axis asks
# systemd directly whether a watched timer is enabled/active and whether its
# paired service's last run actually succeeded within its expected cadence.
#
# Format: label:timer_unit:service_unit:max_staleness_sec, newline-separated.
# max_staleness_sec is how old the service's last successful completion may
# be before that target is considered stale — per-target because cadence
# varies per timer. The separate sustained-before-paging threshold
# (PAPERCLIP_DRIFT_TIMER_THRESHOLD_SEC, default 5400s/90min in
# check-deploy-drift.sh) is one policy constant applied uniformly across
# every watched timer, same posture as CHECKOUT_DEBT_THRESHOLD_SEC /
# UNIT_DEBT_THRESHOLD_SEC.
#
# pr-review: paperclip-pr-review.timer runs on a 30min OnUnitActiveSec
# (see paperclip-pr-review.timer); 5400s (90min) staleness is 3x that cadence,
# floored at the 90min sustained-paging threshold itself so a single missed
# tick never pages.
[Service]
Environment="PAPERCLIP_DRIFT_TIMERS=pr-review:paperclip-pr-review.timer:paperclip-pr-review.service:5400"
Environment="PAPERCLIP_DRIFT_TIMER_ISSUE_URL=https://paperclip/AUR/issues/AUR-5885"
