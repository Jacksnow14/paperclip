# AUR-6177 (follow-up to AUR-4692/AUR-5648): unit-drift (20-units.conf)
# watches installed systemd artifacts, but paperclip-mem-watch.sh,
# paperclip-mem-watch-alert.sh, and paperclip-oom-guard.sh are standalone
# shell scripts under /usr/local/sbin that those units invoke -- deliberately
# independent of the app release pipeline, so unit-drift's own byte-compare
# never touches them. 20-units.conf's own comment used to note mem-watch.*
# had no source-of-truth copy to diff against at all; this axis is that
# follow-up, generalized to all three scripts rather than one at a time.
#
# Format: label:source-relative-path:installed-path, newline-separated.
# source-relative-path is relative to the REPO ROOT (these three scripts live
# in different repo directories, unlike unit-drift's fixed
# scripts/deploy/systemd/ prefix) in the ACTIVE release (compared against
# $APP_ROOT/current, never origin/master -- a merged fix that hasn't been
# re-deployed yet is not drift). Labels are used as log/state filename
# suffixes, so keep them filename-safe.
[Service]
Environment="PAPERCLIP_DRIFT_SCRIPTS=mem-watch:scripts/paperclip-mem-watch.sh:/usr/local/sbin/paperclip-mem-watch.sh\nmem-watch-alert:scripts/deploy/check-mem-watch-alert.sh:/usr/local/sbin/paperclip-mem-watch-alert.sh\noom-guard:scripts/paperclip-oom-guard.sh:/usr/local/sbin/paperclip-oom-guard.sh"
Environment="PAPERCLIP_DRIFT_SCRIPT_ISSUE_URL=https://paperclip/AUR/issues/AUR-6177"
