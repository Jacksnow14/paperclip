openapi: 3.0.3
info:
  title: Routing & Scorecard Engine
  version: 0.1.0
  description: |
    A cost-adjusted performance scorecard and routing-recommendation API.

    Given how much an outcome cost (in tokens, compute-minutes, or any
    comparable unit) alongside how good it was and how much it was worth,
    this API computes a single cost-adjusted score, tracks it over time to
    surface quality regressions early, aggregates it into a return-on-cost
    ledger, and recommends which of several candidates to route new work to
    — always with a human-readable rationale attached.

    See the reference implementation in this directory for a runnable
    server implementing every endpoint below.
servers:
  - url: http://localhost:8787
paths:
  /v1/score:
    post:
      summary: Compute a single cost-adjusted score
      description: |
        Pure function: `score_adjusted = (quality_signal * value_signal) / token_cost`.
        A `token_cost` of zero or less means the cost was never measured — this
        is treated as "unmeasured", not "free": the endpoint returns a null
        score with an explicit reason rather than fabricating a number.
      operationId: computeScore
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreRequest"
      responses:
        "200":
          description: Computed score (or null with a reason, if cost was unmeasured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreResponse"

  /v1/scorecards:
    post:
      summary: Record a scorecard and evaluate it for a quality streak/regression
      description: |
        Appends one scorecard record for an (agent_id, task_type) bucket,
        computes its score_adjusted, and re-evaluates the whole bucket's
        recent history for one of four independent quality signals:

        - **A** — baseline-delta regression (recent mean vs. a longer prior baseline)
        - **B** — a non-strict decline in a small bucket, gated by an absolute
          quality floor and at least one associated rework
        - **C** — sustained low absolute quality
        - **D** — a rework streak (3 of the last 5 outcomes)
      operationId: createScorecard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScorecardCreateRequest"
      responses:
        "201":
          description: Scorecard recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScorecardCreateResponse"
        "400":
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/scorecards/{agent_id}/{task_type}/summary:
    get:
      summary: Summarize an agent's scorecard history for a task type
      description: |
        Returns the sample count, median score_adjusted (over measured-cost
        records only), a return-on-cost aggregate, and the current streak
        evaluation for one (agent_id, task_type) bucket.
      operationId: getScorecardSummary
      parameters:
        - name: agent_id
          in: path
          required: true
          schema:
            type: string
        - name: task_type
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScorecardSummaryResponse"

  /v1/route:
    post:
      summary: Recommend which candidate to route new work to
      description: |
        Given N candidates, each with a set of recent scorecard-like
        records, recommends one using a two-step comparison:

        1. If any candidate has usable cost-adjusted records (excluding
           any flagged as having unmeasured cost), pick the candidate with
           the highest average `score_adjusted` among those that do.
        2. Otherwise, fall back to the candidate with the highest average
           raw `quality_signal`.
        3. If no candidate has any usable data at all, report that
           explicitly rather than guessing — the caller should fall back
           to its own role-based routing.

        The response always includes both the numeric comparison and a
        human-readable rationale string explaining the choice.
      operationId: recommendRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RouteRequest"
      responses:
        "200":
          description: Routing recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RouteResponse"

components:
  schemas:
    ScoreRequest:
      type: object
      required: [token_cost, quality_signal, value_signal]
      properties:
        task_type:
          type: string
          nullable: true
        token_cost:
          type: number
          description: Measured cost of the outcome. <= 0 means unmeasured, not free.
        quality_signal:
          type: number
          description: Self- or reviewer-assessed quality, typically 1-5.
        value_signal:
          type: number
          description: Business value of the outcome relative to a baseline of 1.

    ScoreResponse:
      type: object
      required: [score_adjusted]
      properties:
        score_adjusted:
          type: number
          nullable: true
        reason:
          type: string
          nullable: true
          enum: [unmeasured_cost]

    ScorecardCreateRequest:
      type: object
      required: [agent_id, task_type, token_cost, quality_signal, value_signal]
      properties:
        agent_id:
          type: string
        task_type:
          type: string
        token_cost:
          type: number
        quality_signal:
          type: number
        value_signal:
          type: number
        rework_required:
          type: boolean
          default: false
        outcome:
          type: string
          default: success
        priority:
          type: string
          enum: [urgent, high, medium, low]
          nullable: true
        timestamp:
          type: string
          format: date-time
          description: Defaults to the current time if omitted.

    ScorecardCreateResponse:
      type: object
      required: [id, score_adjusted, exclude_from_aggregates, streak]
      properties:
        id:
          type: string
        score_adjusted:
          type: number
          nullable: true
        reason:
          type: string
          nullable: true
        exclude_from_aggregates:
          type: boolean
          description: True when score_adjusted is null (unmeasured cost) — excluded from ROI/median rollups.
        streak:
          $ref: "#/components/schemas/StreakEvaluation"

    ScorecardSummaryResponse:
      type: object
      required: [agent_id, task_type, sample_count, median_score_adjusted, roi, streak]
      properties:
        agent_id:
          type: string
        task_type:
          type: string
        sample_count:
          type: integer
        median_score_adjusted:
          type: number
          nullable: true
        roi:
          $ref: "#/components/schemas/RoiAggregate"
        streak:
          $ref: "#/components/schemas/StreakEvaluation"

    RoiAggregate:
      type: object
      required: [lifetime_value, lifetime_tokens, roi_ratio, sample_count, excluded_count]
      properties:
        lifetime_value:
          type: number
          description: Quality-weighted, priority/outcome-derived (or explicit) value summed across included records.
        lifetime_tokens:
          type: number
        roi_ratio:
          type: number
          description: lifetime_value per 1,000 tokens spent.
        sample_count:
          type: integer
          description: Records included in the aggregate.
        excluded_count:
          type: integer
          description: Records skipped for having unmeasured cost (AUR-5410 semantics — not folded in as zero-cost).

    StreakEvaluation:
      type: object
      required: [skip, triggers, severity, most_recent_age_days]
      properties:
        skip:
          type: string
          nullable: true
          enum: [too_few_records, stale, no_trigger]
        triggers:
          type: array
          items:
            $ref: "#/components/schemas/DetectorTrigger"
        severity:
          type: number
          nullable: true
          description: Max severity across all triggers, or null if none fired.
        most_recent_age_days:
          type: number
          nullable: true

    DetectorTrigger:
      type: object
      required: [detector, severity, description]
      properties:
        detector:
          type: string
          enum: [A, B, C, D]
        severity:
          type: number
        description:
          type: string

    RouteRequest:
      type: object
      required: [candidates]
      properties:
        candidates:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/RouteCandidate"

    RouteCandidate:
      type: object
      required: [id]
      description: |
        Provide EITHER inline `records` OR `agent_id` (+ optional
        `task_type`) to have the server look up recent records from its
        own store for that agent.
      properties:
        id:
          type: string
        agent_id:
          type: string
          nullable: true
        task_type:
          type: string
          nullable: true
        records:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/CandidateRecord"

    CandidateRecord:
      type: object
      properties:
        score_adjusted:
          type: number
          nullable: true
        quality_signal:
          type: number
          nullable: true
        rework_required:
          type: boolean
        token_cost:
          type: number
        exclude_from_aggregates:
          type: boolean
        metrics_lost:
          type: boolean

    RouteResponse:
      type: object
      required: [chosen_candidate_id, data_available, rationale, candidates]
      properties:
        chosen_candidate_id:
          type: string
          nullable: true
        data_available:
          type: boolean
        rationale:
          type: string
          description: Human-readable explanation of the choice (or the lack of one).
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/CandidateScore"

    CandidateScore:
      type: object
      required:
        - id
        - avg_score_adjusted
        - avg_quality_signal
        - usable_score_adjusted_samples
        - sample_count
        - rework_count
        - fell_back_to_quality
      properties:
        id:
          type: string
        avg_score_adjusted:
          type: number
          nullable: true
        avg_quality_signal:
          type: number
          nullable: true
        usable_score_adjusted_samples:
          type: integer
        sample_count:
          type: integer
        rework_count:
          type: integer
        fell_back_to_quality:
          type: boolean

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
